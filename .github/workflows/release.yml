name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          path: aicw_node

      # go.mod: replace github.com/fystack/mpcium => ../mpcium
      # Layout: $GITHUB_WORKSPACE/{aicw_node,mpcium} as siblings.
      - uses: actions/checkout@v4
        with:
          repository: aicw-protocol/mpcium
          path: mpcium

      - uses: actions/setup-go@v5
        with:
          go-version-file: aicw_node/go.mod

      - name: Build aicw-node
        working-directory: aicw_node
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" \
            -o "dist/aicw-node-${{ matrix.suffix }}${{ matrix.ext }}" \
            ./cmd/aicw-node

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicw-node-${{ matrix.suffix }}
          path: aicw_node/dist/aicw-node-${{ matrix.suffix }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
