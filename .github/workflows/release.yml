name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: windows-latest
            goos: windows
            goarch: amd64
          - runner: macos-latest
            goos: darwin
            goarch: universal
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: aicw_node

      - uses: actions/checkout@v4
        with:
          repository: aicw-protocol/mpcium
          path: mpcium

      - uses: actions/setup-go@v5
        with:
          go-version-file: aicw_node/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1

      - name: Install Linux GUI dependencies
        if: matrix.goos == 'linux'
        working-directory: aicw_node
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev zip

      - name: Install NSIS
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          if (-not (Test-Path $nsis)) {
            $nsis = Join-Path $env:ProgramFiles "NSIS"
          }
          "$nsis" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$nsis\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$nsis\Bin\makensis.exe" /VERSION

      - name: Build GUI
        working-directory: aicw_node
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          chmod +x scripts/build-gui.sh
          ./scripts/build-gui.sh

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicw-node-gui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            aicw_node/dist/aicw-node-setup-*.zip
            aicw_node/dist/aicw-node-setup-*-installer.exe
            aicw_node/dist/aicw-node-setup-darwin-universal.app.zip

  release:
    needs: [build-gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Flatten nested artifact paths
        run: |
          find dist -mindepth 2 -type f -name 'aicw-node-setup-*' -exec cp -t dist/ {} +
          find dist -mindepth 2 -type f -delete 2>/dev/null || true
          find dist -mindepth 2 -type d -empty -delete 2>/dev/null || true
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aicw-node-setup-windows-amd64-installer.exe
            dist/aicw-node-setup-linux-amd64.zip
            dist/aicw-node-setup-darwin-universal.app.zip
          generate_release_notes: true
