# Optional Docker path for node operators (Go install not required).
# Infrastructure (Consul + NATS) + one example node container.
#
# Prerequisites:
#   1. Run `aicw-node init --name mynode` on the host (or mount pre-built identity/)
#   2. Copy config/network-config.yaml.template → config/network-config.yaml
#   3. Create config/password.txt with your node password
#
# Usage:
#   docker compose up -d
#
# Pull pre-built image (when published):
#   docker pull ghcr.io/aicw-protocol/aicw-node:latest

services:
  consul:
    image: hashicorp/consul:1.20
    command: agent -dev --client=0.0.0.0 -ui
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  aicw-node:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        mpcium: ../mpcium
    image: ghcr.io/aicw-protocol/aicw-node:latest
    depends_on:
      consul:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - ./identity:/app/identity:ro
      - ./config/network-config.yaml:/app/config/network-config.yaml:ro
      - ./config/password.txt:/app/config/password.txt:ro
    # Change the node name with: NODE_NAME=alice docker compose up -d
    # (or set NODE_NAME=alice in a .env file next to this compose file).
    # Logs go to stdout only — view them with `docker compose logs -f`.
    command:
      - start
      - --network-config
      - /app/config/network-config.yaml
      - --name
      - ${NODE_NAME:-mynode}
      - --password-file
      - /app/config/password.txt
      - --identity-dir
      - /app/identity
    restart: unless-stopped
